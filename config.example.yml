    model: gemini-2.0-flash-exp
    group: primary
    weight: 1
    rpd_limit: 1500
    rpm_limit: 15

  - id: gemini-35-key4
    type: gemini
    api_key: "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    model: gemini-2.0-flash-exp
