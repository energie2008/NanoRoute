version: '3.8'

services:
  nanoroute:
    build: ..
    image: nanoroute:latest
    container_name: nanoroute
    restart: unless-stopped
    ports:
      - "30128:30128"
    volumes:
      - ../config.yml:/app/config.yml
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # 在此设置管理密码，或者直接在config.yml里配置admin_password
      # - ADMIN_PASSWORD=your_password_here
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:20128/healthz').catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
