<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoRoute · 登录</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font:   'Geist',system-ui,sans-serif;
  --mono:   'Geist Mono',monospace;
  --xs:.75rem;--sm:.875rem;--base:1rem;--lg:1.25rem;--xl:1.75rem;--2xl:2.5rem;
  --r-sm:.375rem;--r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;--r-full:9999px;
  --t:200ms cubic-bezier(.16,1,.3,1);
  --bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  --bg2:#f8fafc;
  --sur:#ffffff;
  --tx:#1e293b;
  --tx2:#64748b;
  --tx3:#94a3b8;
  --bdr:#e2e8f0;
  --pri:#6366f1;
  --pri-h:#4f46e5;
  --pri-d:#e0e7ff;
  --err:#ef4444;
  --sh:0 20px 60px rgba(0,0,0,0.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font);
  min-height:100dvh;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
  position:relative;
  overflow:hidden;
}
body::before{
  content:'';
  position:absolute;
  width:600px;height:600px;
  background:rgba(255,255,255,.1);
  border-radius:50%;
  top:-200px;right:-200px;
  filter:blur(80px);
}
body::after{
  content:'';
  position:absolute;
  width:500px;height:500px;
  background:rgba(255,255,255,.08);
  border-radius:50%;
  bottom:-150px;left:-150px;
  filter:blur(80px);
}
.login-card{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  background:var(--sur);
  border-radius:var(--r-xl);
  box-shadow:var(--sh);
  padding:2.5rem;
  animation:slideUp .5s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{
  display:flex;flex-direction:column;align-items:center;gap:.75rem;
  margin-bottom:2rem;
}
.logo-icon{
  width:56px;height:56px;
  background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
  border-radius:var(--r-lg);
  display:flex;align-items:center;justify-content:center;
  color:white;
  box-shadow:0 8px 24px rgba(99,102,241,.3);
}
.logo-icon svg{width:28px;height:28px}
.logo-title{
  font-size:var(--xl);font-weight:700;
  color:var(--tx);letter-spacing:-.02em;
}
.logo-sub{
  font-size:var(--sm);color:var(--tx2);
}
.field{margin-bottom:1.25rem}
.label{
  display:block;
  font-size:var(--xs);font-weight:600;
  color:var(--tx);
  text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:.5rem;
}
.input{
  width:100%;
  padding:.75rem 1rem;
  font-family:var(--font);font-size:var(--base);
  border:2px solid var(--bdr);
  border-radius:var(--r-md);
  background:var(--bg2);
  color:var(--tx);
  transition:all var(--t);
}
.input:focus{
  outline:none;
  border-color:var(--pri);
  background:white;
  box-shadow:0 0 0 4px rgba(99,102,241,.1);
}
.input::placeholder{color:var(--tx3)}
.input.err{
  border-color:var(--err);
  background:#fef2f2;
  animation:shake .4s;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btn-login{
  width:100%;
  padding:.85rem 1rem;
  font-size:var(--base);font-weight:600;
  background:linear-gradient(135deg,#6366f1 0%,#7c3aed 100%);
  color:white;
  border:none;border-radius:var(--r-md);
  cursor:pointer;
  transition:all var(--t);
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  box-shadow:0 4px 14px rgba(99,102,241,.3);
}
.btn-login:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(99,102,241,.4);
}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{
  opacity:.6;cursor:not-allowed;
  transform:none;
}
.error-msg{
  margin-top:.75rem;
  padding:.65rem .85rem;
  background:#fef2f2;
  border:1px solid #fecaca;
  border-radius:var(--r-sm);
  color:var(--err);
  font-size:var(--sm);
  display:none;
}
.error-msg.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hint{
  margin-top:1.5rem;
  text-align:center;
  font-size:var(--xs);color:var(--tx3);
}
.hint code{
  font-family:var(--mono);
  background:var(--bg2);
  padding:2px 8px;border-radius:var(--r-sm);
  color:var(--tx2);font-weight:500;
}
.spinner{
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:white;
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{
  position:absolute;bottom:1.5rem;
  font-size:var(--xs);color:rgba(255,255,255,.7);
  z-index:1;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="logo-title">NanoRoute</div>
    <div class="logo-sub">多模型路由代理网关</div>
  </div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="field">
      <label class="label">访问密码</label>
      <input type="password" class="input" id="password" placeholder="请输入管理密码" autocomplete="current-password" autofocus>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">
      <span id="btnText">登 录</span>
    </button>
    <div class="error-msg" id="errorMsg"></div>
  </form>

  <div class="hint">
    默认密码: <code>123456</code>
  </div>
</div>

<div class="footer">
  NanoRoute v0.3 · 轻量级LLM路由网关
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const pw = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('btnText');
  const err = document.getElementById('errorMsg');
  const input = document.getElementById('password');
  
  err.classList.remove('show');
  input.classList.remove('err');
  
  if (!pw) {
    showError('请输入密码');
    input.classList.add('err');
    return;
  }
  
  btn.disabled = true;
  btnText.innerHTML = '<div class="spinner"></div>';
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    
    const data = await res.json();
    
    if (data.ok) {
      window.location.href = '/';
    } else {
      showError(data.error || '密码错误');
      input.classList.add('err');
      input.focus();
      input.select();
    }
  } catch (e) {
    showError('网络错误，请重试');
  } finally {
    btn.disabled = false;
    btnText.textContent = '登 录';
  }
}

function showError(msg) {
  const err = document.getElementById('errorMsg');
  err.textContent = msg;
  err.classList.add('show');
}

document.getElementById('password').addEventListener('keydown', () => {
  document.getElementById('password').classList.remove('err');
  document.getElementById('errorMsg').classList.remove('show');
});
</script>
</body>
</html>
