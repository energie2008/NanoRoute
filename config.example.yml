# Combo 定义（模型组合）
combos:
  - id: gemini-primary
    models: 
      - gemini-35-key1
      - gemini-35-key2
      - gemini-35-key3
      - gemini-35-key4
      - gemini-35-key5
      - gemini-35-key6
      - gemini-35-key7
      - gemini-35-key8
    strategy: round-robin

# Model Alias（客户端发什么模型名都能正确路由）
aliases:
  claude-sonnet-4: gemini-primary
  claude-sonnet-4-5: gemini-primary
  claude-3-5-sonnet: gemini-primary
  gpt-4o: gemini-primary
  gpt-4o-mini: gemini-primary
  gemini-2.0-flash-exp: gemini-primary
